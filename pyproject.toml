[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arise-orb"
version = "0.4.45"
description = "ARISE desktop assistant with an owned Pi/Gentle Shell runtime"
requires-python = ">=3.11"
dependencies = ["truststore==0.10.4", "qrcode==8.2", "python-docx==1.2.0", "PySide6==6.10.3", "numpy==2.2.6; sys_platform != 'win32' or platform_machine != 'ARM64'", "numpy==2.5.4; sys_platform == 'win32' and platform_machine == 'ARM64'", "sounddevice==0.5.6", "websockets==15.0.1", "vosk==0.3.45; sys_platform == 'linux' or (sys_platform == 'win32' and platform_machine != 'ARM64')", "psutil==7.2.2", "pywin32==311; sys_platform == 'win32'"]

[project.optional-dependencies]
portable = ["miniaudio==1.72"]
local = ["faster-whisper==1.2.0"]
whisper = ["openai-whisper==20250625", "torch==2.8.0"]
piper = ["piper-tts==1.3.0"]
build = ["pyinstaller==6.16.0"]

[project.scripts]
arise = "arise_app.desktop:main"

[tool.setuptools]
packages = ["arise_app", "assets"]
include-package-data = true

[tool.setuptools.package-data]
assets = ["*.json", "*.ttf", "*.txt", "orb-atlas.png", "icon.svg", "weg-logo.png"]
arise_app = ["resources/*", "resources/i18n/*", "resources/parakeet/*", "resources/parakeet/lib/*", "resources/parakeet/scripts/*"]
