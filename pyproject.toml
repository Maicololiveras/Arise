[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arise-orb"
version = "0.4.8"
description = "ARISE native Windows voice orb with Pi/Gentle Shell and MCP"
requires-python = ">=3.11"
dependencies = ["PySide6==6.10.3", "numpy==2.2.6", "sounddevice==0.5.3", "websockets==15.0.1", "vosk==0.3.45", "psutil==7.0.0", "pywin32==311; sys_platform == 'win32'"]

[project.optional-dependencies]
local = ["faster-whisper==1.2.0"]
whisper = ["openai-whisper==20250625", "torch==2.8.0"]
piper = ["piper-tts==1.3.0"]
build = ["pyinstaller==6.16.0"]

[project.scripts]
arise = "arise_app.desktop:main"

[tool.setuptools]
packages = ["arise_app", "assets"]
include-package-data = true

[tool.setuptools.package-data]
assets = ["*.json", "*.ttf", "*.txt", "orb-atlas.png", "icon.svg"]
arise_app = ["resources/*"]
