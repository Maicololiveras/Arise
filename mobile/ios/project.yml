name: ARISECompanion
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  ARISECompanion:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praxis.arise.ios
        INFOPLIST_KEY_CFBundleDisplayName: ARISE Companion
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your own ARISE computer over your private network.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a message only when you choose the microphone in your paired chat.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ARISECompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ARISECompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praxis.arise.ios.tests
schemes:
  ARISECompanion:
    build:
      targets:
        ARISECompanion: all
    test:
      targets: [ARISECompanionTests]
