plugins { id 'com.android.application' }
def stableChannel = providers.gradleProperty('ariseStable').orNull == 'true'
android {
    namespace 'com.praxis.arise'
    compileSdk 35
    defaultConfig {
        applicationId stableChannel ? 'com.praxis.arise' : 'com.praxis.arise.qa'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.0-qa'
        if (stableChannel) versionName '0.2.0'
        buildConfigField 'boolean', 'IS_PREVIEW', stableChannel ? 'false' : 'true'
        manifestPlaceholders = [appLabel: stableChannel ? 'ARISE Companion' : 'ARISE Companion Preview']
    }
    signingConfigs {
        stable {
            if (System.getenv('ARISE_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ARISE_ANDROID_KEYSTORE'))
                storePassword System.getenv('ARISE_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ARISE_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ARISE_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.stable
            debuggable false
        }
    }
    buildFeatures { buildConfig true }
    sourceSets.main.res.srcDir(layout.buildDirectory.dir("generated/ariseRes"))
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'ai.picovoice:porcupine-android:4.0.2'
    testImplementation 'junit:junit:4.13.2'
}

// Use exactly the first frame used by arise_app.brand, never the old wireframe SVG.
def orbAtlas = rootProject.file('../../assets/orb-atlas.png')
def orbOutput = layout.buildDirectory.dir('generated/ariseRes/drawable-nodpi')
tasks.register('generateAriseOrb') {
    inputs.file(orbAtlas)
    outputs.dir(orbOutput)
    doLast {
        def atlas = javax.imageio.ImageIO.read(orbAtlas)
        if (atlas == null || atlas.width != atlas.height * 24) throw new GradleException('Invalid ARISE orb atlas')
        def output = orbOutput.get().asFile
        output.mkdirs()
        javax.imageio.ImageIO.write(atlas.getSubimage(0, 0, atlas.height, atlas.height), 'png', new File(output, 'arise_orb.png'))
    }
}
tasks.named('preBuild').configure { dependsOn('generateAriseOrb') }

// A stable release must never fall back to the debug signing key.
tasks.configureEach { task ->
    if (task.name in ['validateSigningRelease', 'packageRelease', 'bundleRelease']) {
        task.doFirst {
            if (!stableChannel || !System.getenv('ARISE_ANDROID_KEYSTORE'))
                throw new GradleException('Stable signing configuration is required')
        }
    }
}
