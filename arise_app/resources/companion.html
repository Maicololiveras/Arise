<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARISE · Celular</title><link rel="stylesheet" href="companion.css"><script src="companion.js" defer></script><body><header><strong>ARISE</strong><button id="stop">Detener</button><button id="logout">Desvincular</button></header><p id="status" role="status">Conecta Tailscale y escanea el QR de ARISE en tu PC.</p><form id="pair"><label>Código del PC<input id="code" required autocomplete="off"></label><label>Código del autenticador<input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><label>Nombre del celular<input id="name" value="Mi celular" maxlength="80" required></label><button>Vincular</button></form><button id="activate" hidden>Continuar este chat en el PC</button><section id="approvals" aria-label="Decisiones pendientes"></section><main id="messages" aria-label="Conversación"></main><form id="compose"><label>Mensaje<textarea id="draft" rows="3" maxlength="12000" required></textarea></label><label>Adjuntar imágenes<input id="images" type="file" accept="image/png,image/jpeg" multiple></label><button type="button" id="record">Hablar</button><button id="send">Enviar al PC</button></form><small>El PC realiza las tareas. Hablar graba hasta 29 segundos y transcribe en tu PC; revisa el texto antes de enviarlo. Escuchar usa una voz instalada en Windows. Puedes detener el trabajo en cualquier momento.</small></body></html>
