name: ARISE verification
on:
  push:
    branches: [main, qa, qa-connections-companion]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arise-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parakeet-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require published verified voice artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if gh release view voice-parakeet-v3-2bda32ec70b0 --repo Maicololiveras/Arise --json isDraft,assets > /tmp/parakeet-release.json && python distribution/parakeet/check_release.py < /tmp/parakeet-release.json; then
              exit 0
            fi
            sleep 30
          done
          echo 'Parakeet mirror is not published; app release blocked.'
          exit 1
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run integration suite inside Docker
        run: docker compose run --build --rm tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arise-docker-results
          path: artifacts/test-results.json
  prerequisites:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false
      - name: Prepare minimal Windows dependency bundle
        run: |
          New-Item -ItemType Directory -Force dependency-smoke/bundle/node | Out-Null
          Copy-Item (Get-Command node.exe).Source dependency-smoke/bundle/node/node.exe
          npm.cmd install --prefix dependency-smoke/bundle/node --ignore-scripts --no-audit --no-fund npm@11.19.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_gentle_installer.py --destination dependency-smoke/bundle/gentle-installer
      - name: Verify dependencies before building the application
        run: python scripts/smoke_gentle_prerequisites.py dependency-smoke
  windows:
    needs: prerequisites
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ARISE_BUILD_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'main' || 'qa' }}
      COMPONENTS_AVAILABLE: ${{ secrets.ARISE_COMPONENTS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false
      - name: Dependencies
        run: |
          python -m pip install .[build]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd ci --prefix vendor --ignore-scripts --loglevel verbose
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem "$env:LOCALAPPDATA/npm-cache/_logs/*.log" | Sort-Object LastWriteTime | Select-Object -Last 1 | Get-Content
            exit 1
          }
      - uses: actions/checkout@v4
        if: env.COMPONENTS_AVAILABLE == 'true'
        with:
          token: ${{ secrets.ARISE_COMPONENTS_TOKEN }}
          repository: Maicololiveras/screenview-mcp
          path: components/screenview-mcp
      - uses: actions/checkout@v4
        if: env.COMPONENTS_AVAILABLE == 'true'
        with:
          token: ${{ secrets.ARISE_COMPONENTS_TOKEN }}
          repository: Maicololiveras/inputcontrol-mcp
          path: components/inputcontrol-mcp
      - uses: actions/checkout@v4
        if: env.COMPONENTS_AVAILABLE == 'true'
        with:
          token: ${{ secrets.ARISE_COMPONENTS_TOKEN }}
          repository: Maicololiveras/transcripcion-ia
          path: components/transcripcion-ia
      - uses: actions/checkout@v4
        if: env.COMPONENTS_AVAILABLE == 'true'
        with:
          token: ${{ secrets.ARISE_COMPONENTS_TOKEN }}
          repository: Maicololiveras/forge-mcp
          ref: 079cbd9acaa33def7de52596c5eff10ae65013d8
          path: components/forge-mcp
      - name: Installer compiler
        run: choco install innosetup ffmpeg --no-progress -y
      - name: Build native Windows executable, tools and host
        run: |
          if ($env:COMPONENTS_AVAILABLE -eq 'true') { ./scripts/Build-Windows.ps1 -WithTools -ReposRoot ./components }
          else { ./scripts/Build-Windows.ps1; Write-Host 'Base build includes Pi/Gentle; private MCP repos need ARISE_COMPONENTS_TOKEN.' }
      - name: Verify Windows prerequisites with official Gentle adapter
        run: python scripts/smoke_gentle_prerequisites.py dist/ARISE
      - name: Real bundled MCP catalog smoke tests
        if: env.COMPONENTS_AVAILABLE == 'true'
        run: python scripts/smoke_bundle.py dist/ARISE
      - name: Shipped Rust host, frozen daemon and native renderer
        run: python scripts/smoke_frozen.py dist/ARISE
      - name: Install over running ARISE and preserve user data
        run: python scripts/smoke_installer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arise-windows-build-and-tests
          compression-level: 0
          include-hidden-files: true
          path: |
            artifacts/
            dist/

  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Test dependencies
        run: |
          python -m pip install .[build]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd ci --prefix vendor --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Gentle atomic installation retry tests
        run: node --test scripts/install-gentle-native.test.mjs
      - name: Parakeet worker and session tests
        run: node --test tests/parakeet-voice-worker.test.mjs tests/parakeet-voice-session.test.mjs tests/parakeet-mirror.test.mjs
      - name: Native Windows and protocol tests
        env:
          QT_QPA_PLATFORM: offscreen
          PI_OFFLINE: '1'
        run: python scripts/test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arise-native-test-results
          path: artifacts/test-results.json

  offline-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned Windows model pack
        run: python scripts/prepare_offline_pack.py --cache offline-cache --output dist/ARISE-Models-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: arise-offline-models
          compression-level: 0
          if-no-files-found: error
          path: dist/ARISE-Models-Windows.zip*

  windows-offline:
    needs: [windows, offline-models]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validation dependencies
        run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          name: arise-windows-build-and-tests
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: arise-offline-models
          path: dist
      - name: Validate offline install and real local inference in frozen daemon
        run: python scripts/smoke_offline_pack.py
      - name: Package one-click Windows ZIP
        run: python scripts/build_complete_zip.py --app dist/ARISE --models dist/ARISE-Models-Windows.zip --output complete/ARISE-Windows-Complete.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ARISE-Windows-Complete
          compression-level: 0
          if-no-files-found: error
          path: complete/ARISE-Windows-Complete.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arise-offline-validation
          path: artifacts/offline-pack-validation.json

  publish-update:
    concurrency:
      group: arise-release-metadata
      cancel-in-progress: false
    if: github.event_name == 'push' && (github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main')
    needs: [parakeet-mirror, docker, prerequisites, windows, windows-tests, offline-models, windows-offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: arise-windows-build-and-tests
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ARISE-Windows-Complete
          path: release/complete
      - name: Publish tested Windows release and channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_update.py
