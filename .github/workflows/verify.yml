name: ARISE verification
on:
  push:
    branches: [main, feature/native-orb-daemon]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arise-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run integration suite inside Docker
        run: docker compose run --build --rm tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arise-docker-results
          path: artifacts/test-results.json
  windows:
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      COMPONENTS_AVAILABLE: ${{ secrets.ARISE_COMPONENTS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false
      - name: Dependencies
        run: |
          python -m pip install .[build]
          npm ci --prefix vendor --ignore-scripts
      - name: Check unchanged verified Windows build
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import json, os, urllib.request
          base='3cd85a6c492a42fc8e7cb5915b9046a1e3242cf9'
          repo='Maicololiveras/Arise'; run=37970985140
          def api(path):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as response:return json.load(response)
          reuse=False
          try:
              diff=api('compare/'+base+'...'+os.environ['GITHUB_SHA'])
              allowed={'scripts/smoke_installer.py','.github/workflows/verify.yml'}
              unchanged=diff['status']=='ahead' and all(f['filename'] in allowed and f['status']!='renamed' for f in diff['files']) and len(diff['files'])<300
              previous=api('actions/runs/'+str(run))
              jobs=api('actions/runs/'+str(run)+'/jobs')['jobs']
              steps=next(j['steps'] for j in jobs if j['name']=='windows')
              required={'Build native Windows executable, tools and host','Shipped Rust host, frozen daemon and native renderer'}
              checked=all(any(s['name']==name and s['conclusion']=='success' for s in steps) for name in required)
              reuse=unchanged and previous['head_sha']==base and previous['head_repository']['full_name']==repo and previous['head_branch']=='feature/native-orb-daemon'
              reuse=reuse and checked
          except Exception:pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('reuse='+str(reuse).lower()+'\n')
          print('Reuse previously verified unchanged application:',reuse)
          '@ | python -
      - uses: actions/download-artifact@v4
        id: cached
        if: steps.prebuilt.outputs.reuse == 'true'
        continue-on-error: true
        with:
          name: arise-windows-build-and-tests
          run-id: 37970985140
          github-token: ${{ github.token }}
          path: .
      - name: Gentle atomic installation retry tests
        run: node --test scripts/install-gentle-native.test.mjs
      - name: Native Windows and protocol tests
        env:
          QT_QPA_PLATFORM: offscreen
          PI_OFFLINE: '1'
        run: python scripts/test.py
      - name: Rust supervisor tests
        run: cargo test --locked --manifest-path host/Cargo.toml
      - uses: actions/checkout@v4
        if: env.COMPONENTS_AVAILABLE == 'true'
        with:
          token: ${{ secrets.ARISE_COMPONENTS_TOKEN }}
          repository: Maicololiveras/screenview-mcp
          path: components/screenview-mcp
      - uses: actions/checkout@v4
        if: env.COMPONENTS_AVAILABLE == 'true'
        with:
          token: ${{ secrets.ARISE_COMPONENTS_TOKEN }}
          repository: Maicololiveras/inputcontrol-mcp
          path: components/inputcontrol-mcp
      - uses: actions/checkout@v4
        if: env.COMPONENTS_AVAILABLE == 'true'
        with:
          token: ${{ secrets.ARISE_COMPONENTS_TOKEN }}
          repository: Maicololiveras/transcripcion-ia
          path: components/transcripcion-ia
      - uses: actions/checkout@v4
        if: env.COMPONENTS_AVAILABLE == 'true'
        with:
          token: ${{ secrets.ARISE_COMPONENTS_TOKEN }}
          repository: Maicololiveras/forge-mcp
          path: components/forge-mcp
      - name: Installer compiler
        if: steps.cached.outcome != 'success'
        run: choco install innosetup ffmpeg --no-progress -y
      - name: Build native Windows executable, tools and host
        if: steps.cached.outcome != 'success'
        run: |
          if ($env:COMPONENTS_AVAILABLE -eq 'true') { ./scripts/Build-Windows.ps1 -WithTools -ReposRoot ./components }
          else { ./scripts/Build-Windows.ps1; Write-Host 'Base build includes Pi/Gentle; private MCP repos need ARISE_COMPONENTS_TOKEN.' }
      - name: Real bundled MCP catalog smoke tests
        if: env.COMPONENTS_AVAILABLE == 'true'
        run: python scripts/smoke_bundle.py dist/ARISE
      - name: Shipped Rust host, frozen daemon and native renderer
        run: python scripts/smoke_frozen.py dist/ARISE
      - name: Install over running ARISE and preserve user data
        run: python scripts/smoke_installer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arise-windows-build-and-tests
          include-hidden-files: true
          path: |
            artifacts/
            dist/

  publish-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/native-orb-daemon'
    needs: [docker, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: arise-windows-build-and-tests
          path: release
      - name: Publish tested Windows release and version manifest in main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_update.py
