name: Native distribution previews
on:
  push:
    branches: [feat/platform-distributions]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-previews-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows-x64, runner: windows-latest, arch: x64}
          - {target: windows-arm64, runner: windows-11-arm, arch: arm64}
          - {target: linux-x64, runner: ubuntu-24.04, arch: x64}
          - {target: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64}
          - {target: macos-x64, runner: macos-15-intel, arch: x64}
          - {target: macos-arm64, runner: macos-15, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Install native build dependencies
        run: python -m pip install '.[build,portable]'
      - name: Build and verify native distribution
        run: python scripts/build_native.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ARISE-${{ matrix.target }}-preview
          path: |
            artifacts/ARISE-*-preview.*
            artifacts/*-smoke.json
            artifacts/*-orb.png
          if-no-files-found: error
          retention-days: 14
