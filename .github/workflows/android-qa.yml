name: ARISE Preview Android
on:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android-qa.yml', 'arise_app/resources/companion.*', 'tests/companion-client.test.cjs', 'assets/orb-atlas.png']
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/android-qa.yml', 'arise_app/resources/companion.*', 'tests/companion-client.test.cjs', 'assets/orb-atlas.png']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Companion web client tests
        run: node tests/companion-client.test.cjs
      - name: Unit tests, lint and QA APK
        working-directory: mobile/android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arise-android-qa
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/reports/
          if-no-files-found: error

  publish-android-qa:
    needs: android
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: arise-android-qa-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arise-android-qa
          path: android-artifact
      - name: Publish tested Android QA download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find android-artifact -type f -name '*-debug.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" ARISE-Android-QA.apk
          sha256sum ARISE-Android-QA.apk > ARISE-Android-QA.apk.sha256
          cat > android-notes.md <<'NOTES'
          ARISE Preview for Android: download ARISE-Android-QA.apk from Assets.
          Requires Android 8 or later. This is not an iPad application.
          On the PC, open Settings > Connections > Mobile, configure the authenticator and private connection, then scan the QR code on Android.
          The preview APK uses a debug signature; a later build may require reinstalling and pairing again. Preserve your configuration first.
          Microphone and overlay access require explicit permission. Installing the APK does not enable wake listening.
          The PC transcribes speech and runs tasks. Mobile approval uses the authenticator without expanding PC permissions. Physical-device acceptance remains pending.
          Published from main; QA is a source mirror, not a release source.
          NOTES
          echo "Commit: $GITHUB_SHA · Actions: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> android-notes.md
          python3 - <<'PYMETA'
          import json,re,pathlib
          source=pathlib.Path('mobile/android/app/build.gradle').read_text()
          version=re.search(r"versionName '([^']+)'",source)[1]
          code=int(re.search(r'versionCode (\d+)',source)[1])
          url='https://github.com/Maicololiveras/Arise/releases/download/android-qa-v'+version+'/ARISE-Android-QA.apk'
          pathlib.Path('ARISE-Android-update.json').write_text(json.dumps(dict(schema=1,applicationId='com.praxis.arise.qa',channel='qa',versionCode=code,versionName=version,apkUrl=url))+'\n')
          pathlib.Path('android-version.txt').write_text(version)
          PYMETA
          version=$(cat android-version.txt)
          # Existing APK versions are immutable; branch synchronization never replaces them.
          if gh release view "android-qa-v$version" >/dev/null 2>&1; then
            echo "Android preview already published; retaining its immutable APK."
            exit 0
          fi
          # Publish the versioned APK before advertising it through the update feed.
          gh release create "android-qa-v$version" ARISE-Android-QA.apk ARISE-Android-QA.apk.sha256 --target "$GITHUB_SHA" --title "ARISE Preview Android $version" --notes-file android-notes.md --prerelease --latest=false
          if gh release view android-qa >/dev/null 2>&1; then
            gh release upload android-qa ARISE-Android-QA.apk ARISE-Android-QA.apk.sha256 ARISE-Android-update.json --clobber
            gh release edit android-qa --notes-file android-notes.md --prerelease --latest=false
          else
            gh release create android-qa ARISE-Android-QA.apk ARISE-Android-QA.apk.sha256 ARISE-Android-update.json --target "$GITHUB_SHA" --title 'ARISE Preview Android' --notes-file android-notes.md --prerelease --latest=false
          fi
